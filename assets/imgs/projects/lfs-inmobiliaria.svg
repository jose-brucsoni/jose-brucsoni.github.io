<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Luis Fernando Suarez Inmobiliaria - sitio de agente">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1519"/>
      <stop offset="55%" stop-color="#1f1014"/>
      <stop offset="100%" stop-color="#140a0d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B2D3B"/>
      <stop offset="100%" stop-color="#8B3A4A"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B2D3B"/>
      <stop offset="100%" stop-color="#4E1F28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#6B2D3B" fill-opacity="0.22"/>
  <circle cx="90" cy="620" r="260" fill="#8B3A4A" fill-opacity="0.14"/>
  <circle cx="720" cy="640" r="140" fill="#6B2D3B" fill-opacity="0.12"/>

  <rect x="102" y="86" width="1020" height="535" rx="22" fill="#000000" fill-opacity="0.28"/>
  <rect x="90" y="70" width="1020" height="535" rx="22" fill="url(#panel)"/>

  <!-- Top bar -->
  <rect x="90" y="70" width="1020" height="58" rx="22" fill="#ffffff"/>
  <rect x="90" y="104" width="1020" height="24" fill="#ffffff"/>
  <text x="120" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#6B2D3B">LFS Inmobiliaria</text>
  <text x="520" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Inicio</text>
  <text x="590" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Propiedades</text>
  <text x="710" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Servicios</text>
  <text x="800" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Contacto</text>
  <rect x="920" y="88" width="150" height="32" rx="16" fill="url(#accent)"/>
  <text x="995" y="109" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Panel</text>

  <!-- Hero -->
  <rect x="120" y="148" width="960" height="150" rx="16" fill="url(#hero)"/>
  <text x="160" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Encuentra tu hogar ideal</text>
  <text x="160" y="245" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f3d5db">Compra, venta, alquiler y anticretico - Django 6 + localStorage</text>
  <rect x="160" y="262" width="140" height="28" rx="10" fill="#ffffff"/>
  <text x="230" y="281" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6B2D3B">Ver Propiedades</text>

  <!-- Property cards -->
  <rect x="120" y="320" width="300" height="170" rx="14" fill="#ffffff" stroke="#e8d0d5" stroke-width="1.5"/>
  <rect x="120" y="320" width="300" height="80" rx="14" fill="#8B3A4A"/>
  <rect x="120" y="380" width="300" height="20" fill="#8B3A4A"/>
  <rect x="140" y="336" width="90" height="22" rx="8" fill="#ffffff"/>
  <text x="185" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B2D3B">360 Tour</text>
  <text x="140" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Casa Zona Norte</text>
  <text x="140" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">3 hab - 2 banos - 180 m2</text>
  <text x="140" y="474" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B2D3B">$250,000</text>

  <rect x="450" y="320" width="300" height="170" rx="14" fill="#ffffff" stroke="#e8d0d5" stroke-width="1.5"/>
  <rect x="450" y="320" width="300" height="80" rx="14" fill="#4E1F28"/>
  <rect x="450" y="380" width="300" height="20" fill="#4E1F28"/>
  <rect x="470" y="336" width="70" height="22" rx="8" fill="#f59e0b"/>
  <text x="505" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1f1014">Venta</text>
  <text x="470" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Depto Centro</text>
  <text x="470" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">2 hab - 2 banos - 120 m2</text>
  <text x="470" y="474" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B2D3B">$180,000</text>

  <rect x="780" y="320" width="300" height="170" rx="14" fill="#ffffff" stroke="#e8d0d5" stroke-width="1.5"/>
  <rect x="780" y="320" width="300" height="80" rx="14" fill="#6B2D3B"/>
  <rect x="780" y="380" width="300" height="20" fill="#6B2D3B"/>
  <rect x="800" y="336" width="80" height="22" rx="8" fill="#ffffff"/>
  <text x="840" y="351" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B2D3B">Alquiler</text>
  <text x="800" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Villa Zona Sur</text>
  <text x="800" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">4 hab - 3 banos - 280 m2</text>
  <text x="800" y="474" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B2D3B">$420,000</text>

  <!-- Bottom chips -->
  <rect x="120" y="512" width="180" height="34" rx="10" fill="#fff1f3"/>
  <text x="210" y="534" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B2D3B">Django 6</text>
  <rect x="316" y="512" width="220" height="34" rx="10" fill="#ffffff" stroke="#d4a5ae"/>
  <text x="426" y="534" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B2D3B">HTML / CSS / JS</text>
  <rect x="552" y="512" width="260" height="34" rx="10" fill="#ffffff" stroke="#d4a5ae"/>
  <text x="682" y="534" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B2D3B">Panel + localStorage</text>
  <rect x="828" y="512" width="252" height="34" rx="10" fill="url(#accent)"/>
  <text x="954" y="534" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Repo publico</text>
