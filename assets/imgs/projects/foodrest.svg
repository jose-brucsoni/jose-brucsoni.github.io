  <text x="130" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#6B2D3B">foodRest</text>
  <text x="520" y="108" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Inicio</text>
