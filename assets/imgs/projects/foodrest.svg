    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B2D3B"/>
      <stop offset="100%" stop-color="#8B3A4A"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B2D3B"/>
      <stop offset="100%" stop-color="#4E1F28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#6B2D3B" fill-opacity="0.22"/>
  <circle cx="90" cy="620" r="260" fill="#8B3A4A" fill-opacity="0.14"/>

  <rect x="102" y="86" width="1020" height="535" rx="22" fill="#000000" fill-opacity="0.28"/>
  <rect x="90" y="70" width="1020" height="535" rx="22" fill="url(#panel)"/>

  <rect x="90" y="70" width="1020" height="58" rx="22" fill="#ffffff"/>
