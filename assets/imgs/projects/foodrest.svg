  <text x="160" y="245" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#f3d5db">Av. San Martin, piso 20 - slider, menu y reserva</text>
  <rect x="160" y="262" width="140" height="28" rx="10" fill="#ffffff"/>
  <text x="230" y="281" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6B2D3B">Ver menu</text>

  <rect x="120" y="320" width="300" height="150" rx="14" fill="#ffffff" stroke="#e8d0d5"/>
  <rect x="120" y="320" width="300" height="70" rx="14" fill="#8B3A4A"/>
  <rect x="120" y="370" width="300" height="20" fill="#8B3A4A"/>
  <text x="140" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Desayuno especial</text>
  <text x="140" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B2D3B">Bs. 45</text>

