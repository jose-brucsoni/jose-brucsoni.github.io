  <text x="470" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B2D3B">Bs. 68</text>

  <rect x="780" y="320" width="300" height="150" rx="14" fill="#ffffff" stroke="#e8d0d5"/>
  <rect x="780" y="320" width="300" height="70" rx="14" fill="#6B2D3B"/>
  <rect x="780" y="370" width="300" height="20" fill="#6B2D3B"/>
  <text x="800" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Bebida destacada</text>
  <text x="800" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6B2D3B">Bs. 22</text>

  <rect x="120" y="490" width="640" height="80" rx="14" fill="#ffffff" stroke="#e8d0d5"/>
  <text x="140" y="522" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Formulario de reserva</text>
  <text x="140" y="548" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Nombre, correo, fecha/hora - demo visual (sin API)</text>
  <rect x="780" y="490" width="300" height="80" rx="14" fill="url(#accent)"/>
  <text x="930" y="525" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Bootstrap 3 + jQuery</text>
  <text x="930" y="548" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#f3d5db">Pages en main</text>
