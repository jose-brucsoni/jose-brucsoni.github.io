<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Anglarill Fitness - prototipo Android de nutricion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1519"/>
      <stop offset="55%" stop-color="#1f1014"/>
      <stop offset="100%" stop-color="#140a0d"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B2D3B"/>
      <stop offset="100%" stop-color="#8B3A4A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#6B2D3B" fill-opacity="0.22"/>
  <circle cx="90" cy="620" r="260" fill="#8B3A4A" fill-opacity="0.14"/>

  <rect x="392" y="52" width="416" height="571" rx="42" fill="#1a0c0f"/>
  <rect x="408" y="68" width="384" height="539" rx="32" fill="url(#phone)"/>
  <rect x="548" y="80" width="96" height="14" rx="7" fill="#1a0c0f" fill-opacity="0.35"/>

  <rect x="408" y="104" width="384" height="180" fill="#6B2D3B"/>
  <circle cx="600" cy="168" r="36" fill="#f8fafc" fill-opacity="0.2"/>
  <text x="600" y="176" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">AF</text>
  <text x="600" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Anglarill Fitness</text>
  <text x="600" y="270" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#f3d5db">Splash · 9 segundos</text>

  <rect x="448" y="310" width="304" height="44" rx="12" fill="#ffffff" stroke="#e8d0d5"/>
  <text x="600" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#94a3b8">Correo</text>
  <rect x="448" y="366" width="304" height="44" rx="12" fill="#ffffff" stroke="#e8d0d5"/>
  <text x="600" y="394" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#94a3b8">Contrasena</text>
  <rect x="448" y="428" width="304" height="44" rx="12" fill="url(#accent)"/>
  <text x="600" y="456" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Login (sin auth)</text>
  <text x="600" y="500" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">Prototipo · B2C nutricion</text>
  <text x="600" y="548" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8B3A4A">Demo web en Pages /docs</text>

  <rect x="90" y="220" width="260" height="220" rx="18" fill="#ffffff" fill-opacity="0.95"/>
  <text x="220" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6B2D3B">Android nativa</text>
  <text x="220" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Java · sin AndroidX</text>
  <text x="220" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">minSdk 21 / SDK 28</text>
  <text x="220" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">AppCompat + CardView</text>
  <text x="220" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8B3A4A">Firebase en roadmap</text>

  <rect x="850" y="220" width="260" height="220" rx="18" fill="#ffffff" fill-opacity="0.95"/>
  <text x="980" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6B2D3B">Vision del producto</text>
  <text x="980" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Peso y calorias</text>
  <text x="980" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Planes de comidas</text>
  <text x="980" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Habitos y wearables</text>
  <text x="980" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8B3A4A">Aun no en codigo</text>
