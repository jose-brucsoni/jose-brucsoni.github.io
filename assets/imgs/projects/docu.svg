<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="DOCU - app hibrida de documentos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1519"/>
      <stop offset="55%" stop-color="#1f1014"/>
      <stop offset="100%" stop-color="#140a0d"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B2D3B"/>
      <stop offset="100%" stop-color="#8B3A4A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#6B2D3B" fill-opacity="0.22"/>
  <circle cx="90" cy="620" r="260" fill="#8B3A4A" fill-opacity="0.14"/>

  <!-- Phone frame -->
  <rect x="392" y="52" width="416" height="571" rx="42" fill="#1a0c0f"/>
  <rect x="408" y="68" width="384" height="539" rx="32" fill="url(#phone)"/>
  <rect x="548" y="80" width="96" height="14" rx="7" fill="#1a0c0f" fill-opacity="0.35"/>

  <!-- App header -->
  <rect x="408" y="104" width="384" height="64" fill="#6B2D3B"/>
  <text x="600" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">DOCU</text>

  <!-- Search -->
  <rect x="428" y="184" width="344" height="36" rx="12" fill="#ffffff" stroke="#d4a5ae"/>
  <text x="448" y="207" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94a3b8">Buscar documento...</text>

  <!-- Doc cards -->
  <rect x="428" y="236" width="344" height="78" rx="14" fill="#ffffff" stroke="#e8d0d5"/>
  <rect x="444" y="252" width="46" height="46" rx="8" fill="#6B2D3B"/>
  <text x="504" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Cedula de identidad</text>
  <text x="504" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">Vence 12/2027</text>
  <rect x="680" y="262" width="72" height="22" rx="8" fill="#dcfce7"/>
  <text x="716" y="278" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">Vigente</text>

  <rect x="428" y="326" width="344" height="78" rx="14" fill="#ffffff" stroke="#e8d0d5"/>
  <rect x="444" y="342" width="46" height="46" rx="8" fill="#8B3A4A"/>
  <text x="504" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Licencia de conducir</text>
  <text x="504" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">Vence 04/2026</text>
  <rect x="680" y="352" width="72" height="22" rx="8" fill="#fff7ed"/>
  <text x="716" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">Aviso</text>

  <rect x="428" y="416" width="344" height="78" rx="14" fill="#ffffff" stroke="#e8d0d5"/>
  <rect x="444" y="432" width="46" height="46" rx="8" fill="#4E1F28"/>
  <text x="504" y="450" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Pasaporte</text>
  <text x="504" y="472" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">OCR + Firestore</text>
  <rect x="680" y="442" width="72" height="22" rx="8" fill="#e2e8f0"/>
  <text x="716" y="458" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Sync</text>

  <!-- Capture FAB -->
  <circle cx="600" cy="548" r="28" fill="url(#accent)"/>
  <rect x="588" y="546" width="24" height="4" rx="2" fill="#ffffff"/>
  <rect x="598" y="536" width="4" height="24" rx="2" fill="#ffffff"/>

  <!-- Side notes -->
  <rect x="90" y="220" width="260" height="220" rx="18" fill="#ffffff" fill-opacity="0.95"/>
  <text x="220" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6B2D3B">Captura + OCR</text>
  <text x="220" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Tesseract.js</text>
  <text x="220" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Fechas de vencimiento</text>
  <text x="220" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Avisos locales</text>
  <text x="220" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8B3A4A">Ionic 8 + Angular 20</text>

  <rect x="850" y="220" width="260" height="220" rx="18" fill="#ffffff" fill-opacity="0.95"/>
  <text x="980" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6B2D3B">Cuenta Firebase</text>
  <text x="980" y="290" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Auth + Firestore</text>
  <text x="980" y="320" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Capacitor 7 Android</text>
  <text x="980" y="350" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748b">Demo Pages estatica</text>
  <text x="980" y="400" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8B3A4A">Repo publico</text>
