  <rect x="906" y="512" width="164" height="48" rx="24" fill="#ffffff" fill-opacity="0.18"/>
  <text x="988" y="542" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">No es API oficial</text>
