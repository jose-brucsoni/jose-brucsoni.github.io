  <text x="912" y="271" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">Grupo creado</text>

  <rect x="858" y="306" width="202" height="56" rx="10" fill="#f8fafc" stroke="#e8d0d5"/>
  <circle cx="886" cy="334" r="14" fill="#6B2D3B"/>
  <text x="886" y="339" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="912" y="339" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e293b">Enlace guardado</text>

  <rect x="858" y="374" width="202" height="56" rx="10" fill="#f8fafc" stroke="#e8d0d5"/>
  <circle cx="886" cy="402" r="14" fill="#6B2D3B"/>
  <text x="886" y="407" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
